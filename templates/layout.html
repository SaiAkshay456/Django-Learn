{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    {% block title %}

    {% tailwind_css %}

</head>
<body>
    <h1 class="bg-amber-400">

</body>
</html>
